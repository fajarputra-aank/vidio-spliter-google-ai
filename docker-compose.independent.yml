services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.independent
    environment:
      NODE_ENV: production
      INDEPENDENT_BACKEND: "true"
      PORT: "3000"
      DATABASE_URL: mysql://lensa:lensa_dev_password@mysql:3306/lensa_saku
      AI_PROVIDER: openai
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: lensa-saku-private
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadminpassword
      S3_FORCE_PATH_STYLE: "true"
      RUN_DB_MIGRATIONS: "true"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lensa_saku
      MYSQL_USER: lensa
      MYSQL_PASSWORD: lensa_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 minioadmin minioadminpassword &&
      mc mb --ignore-existing local/lensa-saku-private &&
      mc anonymous set none local/lensa-saku-private"

volumes:
  mysql-data:
  minio-data:
